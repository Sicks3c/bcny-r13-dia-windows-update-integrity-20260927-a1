name: dia-windows-update-integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate official Dia update/install trust boundaries
        shell: powershell
        run: .\run-integrity.ps1
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia-windows-update-integrity-evidence
          path: ${{ runner.temp }}\evidence\*
          if-no-files-found: error
          retention-days: 1
